name: PPOB Sync Katalog

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 03:00 WIB, jam sepi
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint sync katalog PPOB
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            --max-time 90 \
            -X GET "https://domain-kamu.com/api/cron/ppob-sync-katalog" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP Status: $response"
          cat /tmp/response.json
          if [ "$response" -ne 200 ]; then
            echo "Sync gagal dengan status $response"
            exit 1
          fi
